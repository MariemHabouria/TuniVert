name: Status Check

on:
  push:
    branches: [ main ]

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Status Check
      run: |
        echo "✅ Repository: TuniVert"
        echo "✅ Branch: ${{ github.ref_name }}"
        echo "✅ Commit: ${{ github.sha }}"
        echo "✅ GitHub Actions is working!"