# SonarQube Configuration for TuniVert
sonar.projectKey=tunivert
sonar.projectName=TuniVert
sonar.projectVersion=1.0

# SonarQube Server Configuration
sonar.host.url=http://127.0.0.1:9000
sonar.token=sqa_dece4bc44132963e3724bd78aef0dd9418317f76

# Source code
sonar.sources=app,resources,python
sonar.exclusions=vendor/**,node_modules/**,public/**,storage/**,bootstrap/cache/**,**/*.blade.php,tests/**,*.log,*.lock

# Test configurations
sonar.tests=tests
sonar.test.exclusions=vendor/**,node_modules/**

# PHP specific configurations
sonar.php.coverage.reportPaths=coverage.xml
sonar.php.tests.reportPath=tests/junit.xml

# Code analysis
sonar.sourceEncoding=UTF-8
sonar.language=php,py,js

# Quality Gates
sonar.qualitygate.wait=true

# Duplication
sonar.cpd.php.minimumTokens=50
sonar.cpd.exclusions=**/*.blade.php,database/migrations/**,config/**

# Security
sonar.security.hotspots.inheritFromParent=true

# Technical debt
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=php:S1192
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.php

# Laravel specific exclusions
sonar.coverage.exclusions=app/Console/**,app/Exceptions/**,app/Http/Middleware/**,database/**,config/**,app/Providers/**