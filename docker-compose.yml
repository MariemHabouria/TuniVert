version: '3.8'

services:
  # Laravel Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: tunivert_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - tunivert-network
    depends_on:
      - mysql
      - redis
    environment:
      - APP_ENV=local
      - DB_HOST=mysql
      - DB_DATABASE=tunivert
      - DB_USERNAME=tunivert
      - DB_PASSWORD=tunivert123
      - REDIS_HOST=redis
      - DONATION_AI_URL=http://donation-ai:8085
      - FORUM_AI_URL=http://forum-ai:5000/suggestion

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: tunivert_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - tunivert-network
    depends_on:
      - app

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: tunivert_mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: tunivert
      MYSQL_USER: tunivert
      MYSQL_PASSWORD: tunivert123
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/my.cnf
    networks:
      - tunivert-network
    command: --default-authentication-plugin=mysql_native_password

  # Redis Cache
  redis:
    image: redis:alpine
    container_name: tunivert_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tunivert-network

  # Python Donation AI Service
  donation-ai:
    image: python:3.11-slim
    container_name: tunivert_donation_ai
    restart: unless-stopped
    ports:
      - "8085:8085"
    volumes:
      - ./python:/app
    working_dir: /app
    networks:
      - tunivert-network
    environment:
      - PYTHONUNBUFFERED=1
    command: sh -c "pip install -r requirements.txt && python -m uvicorn donation_ai_service:app --host 0.0.0.0 --port 8085 --reload"

  # Python Forum AI Service
  forum-ai:
    image: python:3.11-slim
    container_name: tunivert_forum_ai
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./ia_service:/app
    working_dir: /app
    networks:
      - tunivert-network
    environment:
      - PYTHONUNBUFFERED=1
    command: sh -c "pip install flask && python simple_ai_service.py"

  # Node.js for frontend build
  node:
    image: node:18-alpine
    container_name: tunivert_node
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - tunivert-network
    command: sh -c "npm install && npm run dev"

  # phpMyAdmin for database management
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: tunivert_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root123
    networks:
      - tunivert-network
    depends_on:
      - mysql

  # Mailhog for email testing
  mailhog:
    image: mailhog/mailhog
    container_name: tunivert_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - tunivert-network

  # Prometheus monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: tunivert_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/rules:/etc/prometheus/rules
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - tunivert-network

  # Grafana monitoring dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: tunivert_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - tunivert-network
    depends_on:
      - prometheus

  # Alertmanager for monitoring alerts
  alertmanager:
    image: prom/alertmanager:latest
    container_name: tunivert_alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    networks:
      - tunivert-network

  # SonarQube for code quality analysis
  sonarqube:
    image: sonarqube:community
    container_name: tunivert_sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://sonarqube_db:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar123
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - tunivert-network
    depends_on:
      - sonarqube_db

  # PostgreSQL for SonarQube
  sonarqube_db:
    image: postgres:13
    container_name: tunivert_sonarqube_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar123
      - POSTGRES_DB=sonar
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    networks:
      - tunivert-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local
  sonarqube_data:
    driver: local
  sonarqube_extensions:
    driver: local
  sonarqube_logs:
    driver: local
  sonarqube_db_data:
    driver: local

networks:
  tunivert-network:
    driver: bridge