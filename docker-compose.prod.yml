version: '3.8'

services:
  # Laravel Application
  app:
    build:
      context: .
      target: production
    container_name: tunivert_app_prod
    restart: unless-stopped
    volumes:
      - app_storage:/var/www/html/storage
      - app_logs:/var/www/html/storage/logs
    networks:
      - tunivert-network
      - monitoring
    depends_on:
      - mysql
      - redis
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=mysql
      - DB_DATABASE=tunivert
      - DB_USERNAME=tunivert
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - DONATION_AI_URL=http://donation-ai:8085
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Load Balancer
  nginx:
    image: nginx:alpine
    container_name: tunivert_nginx_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
      - app_storage:/var/www/html/storage:ro
    networks:
      - tunivert-network
      - monitoring
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: tunivert_mysql_prod
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tunivert
      MYSQL_USER: tunivert
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/production.cnf:/etc/mysql/my.cnf
      - ./backups:/backups
    networks:
      - tunivert-network
      - monitoring
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache
  redis:
    image: redis:alpine
    container_name: tunivert_redis_prod
    restart: unless-stopped
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - tunivert-network
      - monitoring
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Python Donation AI Service
  donation-ai:
    build:
      context: ./python
      dockerfile: Dockerfile
    container_name: tunivert_donation_ai_prod
    restart: unless-stopped
    networks:
      - tunivert-network
      - monitoring
    environment:
      - PYTHONUNBUFFERED=1
      - ENV=production

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: tunivert_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/rules:/etc/prometheus/rules
      - prometheus_data:/prometheus
    networks:
      - monitoring
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: tunivert_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - monitoring
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false

  # Node Exporter for system metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: tunivert_node_exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - monitoring
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  # MySQL Exporter for database metrics
  mysql-exporter:
    image: prom/mysqld-exporter:latest
    container_name: tunivert_mysql_exporter
    restart: unless-stopped
    networks:
      - tunivert-network
      - monitoring
    environment:
      - DATA_SOURCE_NAME=tunivert:${DB_PASSWORD}@(mysql:3306)/tunivert
    depends_on:
      - mysql

  # Redis Exporter
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: tunivert_redis_exporter
    restart: unless-stopped
    networks:
      - tunivert-network
      - monitoring
    environment:
      - REDIS_ADDR=redis://redis:6379
    depends_on:
      - redis

  # Nginx Exporter
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: tunivert_nginx_exporter
    restart: unless-stopped
    networks:
      - monitoring
    command:
      - '-nginx.scrape-uri=http://nginx/metrics'
    depends_on:
      - nginx

  # Alertmanager
  alertmanager:
    image: prom/alertmanager:latest
    container_name: tunivert_alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    networks:
      - monitoring
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'

  # Loki for log aggregation
  loki:
    image: grafana/loki:latest
    container_name: tunivert_loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/tmp/loki
    networks:
      - monitoring
    command: -config.file=/etc/loki/local-config.yaml

  # Promtail for log collection
  promtail:
    image: grafana/promtail:latest
    container_name: tunivert_promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml
      - app_logs:/var/log/app:ro
      - /var/log:/var/log:ro
    networks:
      - monitoring
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  # SonarQube
  sonarqube:
    image: sonarqube:community
    container_name: tunivert_sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://postgres:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=${SONAR_DB_PASSWORD}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - monitoring
    depends_on:
      - postgres

  # PostgreSQL for SonarQube
  postgres:
    image: postgres:13
    container_name: tunivert_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=${SONAR_DB_PASSWORD}
      - POSTGRES_DB=sonar
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - monitoring

volumes:
  mysql_data:
  redis_data:
  app_storage:
  app_logs:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  loki_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgres_data:

networks:
  tunivert-network:
    driver: bridge
  monitoring:
    driver: bridge