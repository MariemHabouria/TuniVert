<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fichier trop volumineux - TuniVert</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body text-center p-5">
                        <div class="mb-4">
                            <i class="fas fa-exclamation-triangle text-warning" style="font-size: 4rem;"></i>
                        </div>
                        <h2 class="text-danger mb-3">Fichier trop volumineux</h2>
                        <p class="lead mb-4">Le fichier que vous tentez d'uploader est trop volumineux.</p>
                        
                        <div class="alert alert-info text-start">
                            <h6><i class="fas fa-info-circle me-2"></i>Limites acceptées :</h6>
                            <ul class="mb-0">
                                <li>Taille maximale : <strong>10 MB</strong></li>
                                <li>Formats acceptés : JPG, PNG, PDF, DOC, DOCX</li>
                            </ul>
                        </div>
                        
                        <div class="mt-4">
                            <button onclick="history.back()" class="btn btn-primary me-2">
                                <i class="fas fa-arrow-left me-1"></i>Retour
                            </button>
                            <a href="/" class="btn btn-outline-secondary">
                                <i class="fas fa-home me-1"></i>Accueil
                            </a>
                        </div>
                        
                        <hr class="my-4">
                        <small class="text-muted">
                            <i class="fas fa-lightbulb me-1"></i>
                            <strong>Conseil :</strong> Compressez vos images ou utilisez un format plus léger pour réduire la taille du fichier.
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
