<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" width="50" height="50">
  <!-- Plant icon - simplified for mini version -->
  <g transform="translate(10, 8)">
    <!-- Left leaf -->
    <path d="M15 12 C5 4, -2 9, 6 19 C9 16, 12 14, 15 12 Z" fill="#4CAF50"/>
    <!-- Right leaf -->
    <path d="M15 12 C25 4, 32 9, 24 19 C21 16, 18 14, 15 12 Z" fill="#4CAF50"/>
    
    <!-- Inner details -->
    <path d="M15 12 C8 6, 4 10, 9 16" fill="none" stroke="#66BB6A" stroke-width="1"/>
    <path d="M15 12 C22 6, 26 10, 21 16" fill="none" stroke="#66BB6A" stroke-width="1"/>
    
    <!-- Stem -->
